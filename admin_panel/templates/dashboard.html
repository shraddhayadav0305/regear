<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="bg-dark text-white p-3" style="width: 250px; height: 100vh;">
            <h4>ReGear Admin</h4>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="/" class="nav-link text-white">Dashboard</a></li>
                <li class="nav-item"><a href="/users" class="nav-link text-white">User Management</a></li>
                <li class="nav-item"><a href="/listings" class="nav-link text-white">Listings</a></li>
                <li class="nav-item"><a href="/boosted-listings" class="nav-link text-white">Boosted Listings</a></li>
                <li class="nav-item"><a href="/categories" class="nav-link text-white">Categories</a></li>
                <li class="nav-item"><a href="/complaints" class="nav-link text-white">Complaints</a></li>
                <li class="nav-item"><a href="/transactions" class="nav-link text-white">Transactions</a></li>
                <li class="nav-item"><a href="/analytics" class="nav-link text-white">Analytics</a></li>
                <li class="nav-item"><a href="/logs" class="nav-link text-white">Activity Logs</a></li>
                <li class="nav-item"><a href="/settings" class="nav-link text-white">Settings</a></li>
                <li class="nav-item"><a href="/" class="nav-link text-white">View Website</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <div class="p-4" style="flex: 1;">
            <h1>Admin Dashboard</h1>
            <div class="row">
                <!-- KPI Cards -->
                <div class="col-md-3">
                    <div class="card bg-primary text-white mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Total Users</h5>
                            <p class="card-text">1,234</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-success text-white mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Active Users</h5>
                            <p class="card-text">567</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-danger text-white mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Blocked Users</h5>
                            <p class="card-text">12</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-warning text-white mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Total Listings</h5>
                            <p class="card-text">345</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Charts -->
            <div class="row">
                <div class="col-md-6">
                    <canvas id="listingsGrowthChart"></canvas>
                </div>
                <div class="col-md-6">
                    <canvas id="userGrowthChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Listings Growth Chart
        const listingsGrowthCtx = document.getElementById('listingsGrowthChart').getContext('2d');
        new Chart(listingsGrowthCtx, {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'],
                datasets: [{
                    label: 'Listings Growth',
                    data: [10, 20, 30, 40, 50],
                    borderColor: 'rgba(75, 192, 192, 1)',
                    tension: 0.1
                }]
            }
        });

        // User Growth Chart
        const userGrowthCtx = document.getElementById('userGrowthChart').getContext('2d');
        new Chart(userGrowthCtx, {
            type: 'bar',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May'],
                datasets: [{
                    label: 'User Growth',
                    data: [5, 15, 25, 35, 45],
                    backgroundColor: 'rgba(153, 102, 255, 0.2)',
                    borderColor: 'rgba(153, 102, 255, 1)',
                    borderWidth: 1
                }]
            }
        });
    </script>
</body>
</html>
