<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose a Plan - ReGear</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {background:#f8f9fa;}
        .plan-card {border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.1);}
        .most-popular {border:2px solid #007bff;}
        .plan-header {font-size:1.25rem; font-weight:600;}
        .plan-price {font-size:2rem; font-weight:700;}
    </style>
</head>
<body>
<div class="container py-5">
    <h2 class="text-center mb-4">Select a Subscription Plan</h2>
    <div class="row g-4">
        {% for pkg in packages %}
        <div class="col-md-4">
            <div class="card plan-card {% if pkg.key=='standard' %}most-popular{% endif %}">
                <div class="card-body text-center">
                    {% if pkg.key=='standard' %}<div class="badge bg-primary mb-2">Most Popular</div>{% endif %}
                    <div class="plan-header">{{ pkg.name }}</div>
                    <div class="plan-price">₹{{ pkg.price }}/month</div>
                    <ul class="list-unstyled mt-3 mb-4 text-start">
                        {% for feat in pkg.features %}
                        <li>• {{ feat }}</li>
                        {% endfor %}
                    </ul>
                    <form method="POST" action="">
                        <input type="hidden" name="plan" value="{{ pkg.key }}">
                        <button class="btn btn-outline-primary w-100" type="submit">Select Plan</button>
                    </form>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
</body>
</html>
