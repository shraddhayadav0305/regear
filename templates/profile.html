{% extends "dashboard.html" %}
{% block title %}My Profile - ReGear{% endblock %}
{% block content %}
<div class="welcome-section">
    <div class="section-title"><i class="fas fa-user"></i> My Profile</div>
    <form method="POST" action="/profile" enctype="multipart/form-data">
      <div class="row">
        <div class="col-md-4 mb-3">
          <div class="text-center">
            <div style="width:120px;height:120px;border-radius:50%;overflow:hidden;margin:0 auto;position:relative;background:#eef2f7;display:flex;align-items:center;justify-content:center;">
              {% if user.profile_photo %}
                <img src="{{ user.profile_photo|imgurl }}" alt="Profile" style="width:100%;height:100%;object-fit:cover;">
              {% else %}
                <i class="fas fa-user" style="font-size:48px;color:#9ca3af;"></i>
              {% endif %}
            </div>
            <div class="d-grid gap-2 mt-3">
              <input type="file" name="profile_photo" accept="image/jpeg,image/png" class="form-control">
              {% if user.profile_photo %}
              <button class="btn btn-outline-danger" name="remove_photo" value="1" type="submit"><i class="fas fa-trash"></i> Remove Photo</button>
              {% endif %}
            </div>
            <small class="text-muted d-block mt-2">Allowed: JPG, JPEG, PNG • Max 5MB</small>
          </div>
        </div>
        <div class="col-md-8">
          <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label">Full Name</label>
                <input class="form-control" type="text" name="username" value="{{ user.username }}" required>
            </div>
            <div class="col-md-6">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" value="{{ user.email }}" disabled>
            </div>
            <div class="col-md-6">
                <label class="form-label">Phone</label>
                <input class="form-control" type="text" name="phone" value="{{ user.phone or '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">Location</label>
                <input class="form-control" type="text" name="location" value="{{ user.location or '' }}">
            </div>
            <div class="col-md-6">
                <label class="form-label">New Password (optional)</label>
                <input class="form-control" type="password" name="new_password" placeholder="Leave blank to keep unchanged">
            </div>
            <div class="col-12">
                <button class="btn btn-primary" type="submit"><i class="fas fa-save"></i> Save Changes</button>
                <a class="btn btn-outline-secondary" href="/seller/{{ user.id }}">View Public Profile</a>
            </div>
          </div>
        </div>
      </div>
    </form>
</div>
{% endblock %}
