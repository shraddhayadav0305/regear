<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Product - ReGear</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f8f9fa;
        }

        .card {
            margin: 20px auto;
            max-width: 800px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            background-color: #667eea;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            border-radius: 12px 12px 0 0;
        }

        .card-body {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            font-weight: bold;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .form-group textarea {
            resize: vertical;
        }

        .btn-primary {
            background-color: #667eea;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 6px;
        }

        .btn-primary:hover {
            background-color: #5563c1;
        }

        .step-indicator {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .step-indicator .step {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-bottom: 3px solid #ddd;
            font-weight: bold;
            color: #888;
        }

        .step-indicator .step.active {
            border-color: #667eea;
            color: #667eea;
        }

        .image-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .image-preview img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .image-preview .remove-btn {
            position: relative;
            top: -10px;
            right: -10px;
            background: red;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                Post Your Product
            </div>
            <div class="card-body">
                <div class="step-indicator">
                    <div class="step active" id="step1">Step 1: Select Category</div>
                    <div class="step" id="step2">Step 2: Select Subcategory</div>
                    <div class="step" id="step3">Step 3: Product Details</div>
                    <div class="step" id="step4">Step 4: Upload Images</div>
                    <div class="step" id="step5">Step 5: Price & Location</div>
                </div>

                <form id="postProductForm" action="/post-product" method="POST" enctype="multipart/form-data">
                    <!-- Step 1: Select Category -->
                    <div class="form-step" id="formStep1">
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" name="category" class="form-control" required>
                                <option value="">Select a category</option>
                                <!-- Categories will be dynamically loaded here -->
                            </select>
                        </div>
                        <button type="button" class="btn btn-primary" id="nextToStep2">Next</button>
                    </div>

                    <!-- Step 2: Select Subcategory -->
                    <div class="form-step" id="formStep2" style="display: none;">
                        <div class="form-group">
                            <label for="subcategory">Subcategory</label>
                            <select id="subcategory" name="subcategory" class="form-control" required>
                                <option value="">Select a subcategory</option>
                                <!-- Subcategories will be dynamically loaded here -->
                            </select>
                        </div>
                        <button type="button" class="btn btn-secondary" id="backToStep1">Back</button>
                        <button type="button" class="btn btn-primary" id="nextToStep3">Next</button>
                    </div>

                    <!-- Step 3: Product Details -->
                    <div class="form-step" id="formStep3" style="display: none;">
                        <div class="form-group">
                            <label for="title">Product Title</label>
                            <input type="text" id="title" name="title" class="form-control" placeholder="Enter product title" required>
                        </div>

                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" name="description" class="form-control" rows="4" placeholder="Enter product description" required></textarea>
                        </div>

                        <div class="form-group">
                            <label for="brand">Brand</label>
                            <input type="text" id="brand" name="brand" class="form-control" placeholder="Enter brand">
                        </div>

                        <button type="button" class="btn btn-secondary" id="backToStep2">Back</button>
                        <button type="button" class="btn btn-primary" id="nextToStep4">Next</button>
                    </div>

                    <!-- Step 4: Upload Images -->
                    <div class="form-step" id="formStep4" style="display: none;">
                        <div class="form-group">
                            <label for="photos">Upload Images</label>
                            <div class="image-upload">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <p>Drag & drop images here or click to upload</p>
                                <input type="file" id="photos" name="photos" multiple accept="image/*">
                            </div>
                            <div id="imagePreview" class="image-preview"></div>
                        </div>

                        <button type="button" class="btn btn-secondary" id="backToStep3">Back</button>
                        <button type="button" class="btn btn-primary" id="nextToStep5">Next</button>
                    </div>

                    <!-- Step 5: Price & Location -->
                    <div class="form-step" id="formStep5" style="display: none;">
                        <div class="form-group">
                            <label for="price">Price</label>
                            <input type="number" id="price" name="price" class="form-control" placeholder="Enter price" required>
                        </div>

                        <div class="form-group">
                            <label for="location">Location</label>
                            <input type="text" id="location" name="location" class="form-control" placeholder="Enter location" required>
                        </div>

                        <button type="button" class="btn btn-secondary" id="backToStep4">Back</button>
                        <button type="submit" class="btn btn-success">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const steps = document.querySelectorAll('.form-step');
            const indicators = document.querySelectorAll('.step-indicator .step');
            let currentStep = 0;

            function showStep(step) {
                steps.forEach((s, index) => {
                    s.style.display = index === step ? 'block' : 'none';
                    indicators[index].classList.toggle('active', index === step);
                });
            }

            document.getElementById('nextToStep2').addEventListener('click', function() {
                currentStep = 1;
                showStep(currentStep);
            });

            document.getElementById('backToStep1').addEventListener('click', function() {
                currentStep = 0;
                showStep(currentStep);
            });

            document.getElementById('nextToStep3').addEventListener('click', function() {
                currentStep = 2;
                showStep(currentStep);
            });

            document.getElementById('backToStep2').addEventListener('click', function() {
                currentStep = 1;
                showStep(currentStep);
            });

            document.getElementById('nextToStep4').addEventListener('click', function() {
                currentStep = 3;
                showStep(currentStep);
            });

            document.getElementById('backToStep3').addEventListener('click', function() {
                currentStep = 2;
                showStep(currentStep);
            });

            document.getElementById('nextToStep5').addEventListener('click', function() {
                currentStep = 4;
                showStep(currentStep);
            });

            document.getElementById('backToStep4').addEventListener('click', function() {
                currentStep = 3;
                showStep(currentStep);
            });

            // Fetch categories on page load
            const categorySelect = document.getElementById('category');
            const subcategorySelect = document.getElementById('subcategory');

            fetch('/api/categories')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        data.categories.forEach(category => {
                            const option = document.createElement('option');
                            option.value = category.id;
                            option.textContent = category.name;
                            categorySelect.appendChild(option);
                        });
                    } else {
                        console.error('Error fetching categories:', data.error);
                    }
                });

            // Fetch subcategories when a category is selected
            categorySelect.addEventListener('change', function() {
                const categoryId = this.value;
                subcategorySelect.innerHTML = '<option value="">Select a subcategory</option>';

                if (categoryId) {
                    fetch(`/api/subcategories/${categoryId}`)
                        .then(response => response.json())
                        .then(data => {
                            if (data.success) {
                                data.subcategories.forEach(subcategory => {
                                    const option = document.createElement('option');
                                    option.value = subcategory.id;
                                    option.textContent = subcategory.name;
                                    subcategorySelect.appendChild(option);
                                });
                            } else {
                                console.error('Error fetching subcategories:', data.error);
                            }
                        });
                }
            });

            // Handle drag and drop
            const imageUploadInput = document.getElementById('photos');
            const imagePreviewContainer = document.getElementById('imagePreview');
            const imageUploadArea = document.querySelector('.image-upload');

            imageUploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                imageUploadArea.classList.add('hover');
            });

            imageUploadArea.addEventListener('dragleave', () => {
                imageUploadArea.classList.remove('hover');
            });

            imageUploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                imageUploadArea.classList.remove('hover');
                const files = e.dataTransfer.files;
                handleFiles(files);
            });

            imageUploadInput.addEventListener('change', (e) => {
                const files = e.target.files;
                handleFiles(files);
            });

            function handleFiles(files) {
                Array.from(files).forEach(file => {
                    if (file.type.startsWith('image/')) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const imgDiv = document.createElement('div');
                            imgDiv.classList.add('image-preview-item');

                            const img = document.createElement('img');
                            img.src = e.target.result;
                            imgDiv.appendChild(img);

                            const removeBtn = document.createElement('button');
                            removeBtn.classList.add('image-remove');
                            removeBtn.innerHTML = '&times;';
                            removeBtn.addEventListener('click', () => {
                                imgDiv.remove();
                            });
                            imgDiv.appendChild(removeBtn);

                            imagePreviewContainer.appendChild(imgDiv);
                        };
                        reader.readAsDataURL(file);
                    } else {
                        alert('Only image files are allowed!');
                    }
                });
            }
        });
    </script>
</body>
</html>
